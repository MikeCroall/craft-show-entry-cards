name: Rust CI

on:
    push:
        paths-ignore: [".github/dependabot.yml", "**.md"]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
    contents: read

jobs:
    fmt:
        name: Format
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - run: cargo fmt --all -- --check

    deps:
        name: Dependency checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
            - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              if: ${{ !cancelled() }}
              with:
                  command: check advisories bans

    clippy:
        name: Clippy (${{ matrix.name }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: native
                      args: --all-targets
                    - name: wasm
                      args: --target wasm32-unknown-unknown
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  key: ${{ matrix.name }}
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - run: cargo clippy --workspace --all-features ${{ matrix.args }} --locked -- -D warnings

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
              with:
                  tool: nextest
            - name: Test
              run: cargo nextest run --workspace --all-features
            # Skipping doc tests due to no lib targets (`cargo test --doc --workspace --all-features`)

    build-wasm:
        name: Build wasm page
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
              with:
                  tool: trunk
            - run: trunk build --release
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist/
                  retention-days: 1
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              if: github.ref_name == github.event.repository.default_branch
              with:
                  path: "./dist"

    playwright-tests:
        name: Playwright tests
        needs: build-wasm
        runs-on: ubuntu-latest

        timeout-minutes: 60
        defaults:
            run:
                working-directory: ./playwright-tests

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dist
                  path: site/craft-show-entry-cards
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: playwright-tests/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Type check Playwright tests
              run: npx tsc --noEmit
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests
              run: npx playwright test
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-tests/playwright-report/
                  retention-days: 30

    publish-github-pages:
        name: Deploy to GitHub Pages
        runs-on: ubuntu-slim

        needs: [fmt, deps, clippy, test, playwright-tests]

        if: github.ref_name == github.event.repository.default_branch

        permissions:
            id-token: write
            pages: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

    success:
        name: Check success
        needs:
            [
                fmt,
                deps,
                clippy,
                test,
                build-wasm,
                playwright-tests,
                publish-github-pages,
            ]
        if: always()
        runs-on: ubuntu-slim
        env:
            NEEDS: ${{ toJSON(needs) }}
        steps:
            - name: Print all results
              run: echo "$NEEDS"
            - name: Exit if any failures or cancellations
              if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
              run: exit 1
