[package]
name = "craft-show-entry-cards"
authors = ["Mike Croall"]
version = "0.1.0"
edition = "2024"

[package.metadata.typst-bake]
template-dir = "./typst"
fonts-dir = "./fonts"

[dependencies]
base64 = "0.23.0"
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.20", features = ["csr"] }
leptos-use = "0.19.0"
typst-bake = "0.1.11"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
